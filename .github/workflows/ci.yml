name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  # Daily: the tenant SQL check of runtime master against this API, also without a new API change (MUP-ONA A11).
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read

jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    # Logins and tenant isolation (tests/test_identity.py) run against a real PostgreSQL; a missing one fails.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: nodestro-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      NODESTRO_TEST_POSTGRES: host=127.0.0.1 port=5432 user=postgres password=nodestro-ci dbname=postgres
      NODESTRO_REQUIRE_POSTGRES: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: |
          pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest -rs --junitxml=junit-test-${{ matrix.python }}.xml
        env:
          # One test installs a real package from PyPI with uv (needs the network).
          NODESTRO_NETWORK_TESTS: ${{ matrix.python == '3.13' && '1' || '' }}
      # The skipped tests must be exactly the expected ones, each with its reason (MUP-ONA A0, T-SKIP-1): a test that
      # starts to skip (a missing service, a lost variable) fails the job. A changed expectation needs a reason in the PR.
      - name: Skipped tests are the expected ones
        run: python scripts/check_skips.py junit-test-${{ matrix.python }}.xml tests/ci/skipped-test-${{ matrix.python }}.txt
      # Known vulnerabilities in the installed dependencies (as orkexa's CI checks them). Blocking: an advisory that
      # was reviewed and cannot be fixed yet goes into PIP_AUDIT_IGNORE (space-separated IDs, with the reason here).
      - name: Dependency audit
        if: matrix.python == '3.13'
        env:
          PIP_AUDIT_IGNORE: ""
        run: |
          pip install pip-audit==2.10.1
          args=(); for id in $PIP_AUDIT_IGNORE; do args+=(--ignore-vuln "$id"); done
          pip-audit --skip-editable --progress-spinner off "${args[@]}"

  package:
    # The wheel installs on its own and contains what the package needs at run time.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install build==1.6.1
      - run: python -m build
      - name: Install the wheel into a fresh environment
        run: |
          python -m venv "$RUNNER_TEMP/wheel"
          "$RUNNER_TEMP/wheel/bin/pip" install dist/*.whl
      - name: Check the installed wheel
        run: |
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel/bin/python" -c "import nodestro_api as p; print(p.__name__, p.__version__)"
      - name: Start the installed API and call it over HTTP
        run: |
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel/bin/nodestro-api" --data-dir "$RUNNER_TEMP/data" --port 8765 > "$RUNNER_TEMP/server.log" 2>&1 &
          server=$!
          for _ in $(seq 60); do curl -fsS http://127.0.0.1:8765/api/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:8765/api/health
          curl -fsS http://127.0.0.1:8765/api/openapi.json > /dev/null
          curl -fsS http://127.0.0.1:8765/api/meta > /dev/null
          # A foreign host name is refused (DNS rebinding protection).
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: attacker.example' http://127.0.0.1:8765/api/health)" = 403
          kill "$server"
          wait "$server" || true
          cat "$RUNNER_TEMP/server.log"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  tenant-sql:
    # Every PostgreSQL statement of the API on tenant data is bound to one tenant (security review SR-01), checked by
    # the runtime's tenant SQL check twice (MUP-ONA A11, PS-10): with the runtime this API pins, and with the current
    # runtime master, installed the same way as the pin (public git+https, no secret), so a rule change on the
    # runtime reaches the API before its next pin bump; daily as well. NODESTRO_REQUIRE_TENANT_SCAN=1: a checker that
    # cannot be imported, a missing pglast, a failed install, a scan of no file, a planted leak that is not reported
    # or a runtime that is not master fails the job; it never skips.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODESTRO_REQUIRE_TENANT_SCAN: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: tenant-sql (pinned)
        run: |
          pytest -rs --junitxml=junit-tenant-sql.xml tests/test_tenant_filters.py tests/test_tenant_sql_scan.py
          python scripts/check_skips.py junit-tenant-sql.xml tests/ci/skipped-tenant-sql.txt
          python scripts/tenant_sql_scan.py
      - name: tenant-sql (runtime master)
        run: |
          set -euo pipefail
          repository=https://github.com/peterkarlhuber/nodestro-runtime.git
          python -m venv "$RUNNER_TEMP/runtime-master"
          # The checker needs the standard library, pglast (the range of the dev extra) and, since MUP-ONA B6, its rule
          # engine orkexa.testing.sqlcheck: orkexa with its own dependencies and the sqlcheck extra, at the commit this
          # runtime pins.
          "$RUNNER_TEMP/runtime-master/bin/pip" install --no-deps "nodestro-runtime @ git+$repository@master"
          "$RUNNER_TEMP/runtime-master/bin/pip" install "pglast>=7,<9"
          orkexa_url="$("$RUNNER_TEMP/runtime-master/bin/python" -I -c 'import importlib.metadata as m; print(next(r for r in m.requires("nodestro-runtime") if r.startswith("orkexa") and "extra ==" not in r).split("@", 1)[1].strip())')"
          echo "orkexa pinned by the runtime: $orkexa_url"
          "$RUNNER_TEMP/runtime-master/bin/pip" install "orkexa[sqlcheck] @ $orkexa_url"
          master="$(git ls-remote "$repository" refs/heads/master | cut -f1)"
          test -n "$master" || { echo "::error::runtime master not found with git ls-remote"; exit 1; }
          echo "runtime master: $master"
          # Prints the installed runtime's commit and fails unless it is master (T-CHK-6).
          "$RUNNER_TEMP/runtime-master/bin/python" -I scripts/tenant_sql_scan.py \
            --package src/nodestro_api --expect-runtime-commit "$master"
