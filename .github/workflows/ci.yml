name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    # Logins and tenant isolation (tests/test_identity.py) run against a real PostgreSQL; a missing one fails.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: nodestro-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      NODESTRO_TEST_POSTGRES: host=127.0.0.1 port=5432 user=postgres password=nodestro-ci dbname=postgres
      NODESTRO_REQUIRE_POSTGRES: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      # The Nodestro components and orkexa are private: pip clones them with a token that can read them.
      - name: Grant read access to the private repositories
        env:
          NODESTRO_READ: ${{ secrets.NODESTRO_READ }}
        run: |
          if [ -z "$NODESTRO_READ" ]; then
            echo "::error::The secret NODESTRO_READ is missing: a token that can read orkexa and the nodestro repositories."
            exit 1
          fi
          git config --global url."https://x-access-token:${NODESTRO_READ}@github.com/peterkarlhuber/".insteadOf "https://github.com/peterkarlhuber/"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest
        env:
          # One test installs a real package from PyPI with uv (needs the network).
          NODESTRO_NETWORK_TESTS: ${{ matrix.python == '3.13' && '1' || '' }}

  package:
    # The wheel installs on its own and contains what the package needs at run time.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      # The Nodestro components and orkexa are private: pip clones them with a token that can read them.
      - name: Grant read access to the private repositories
        env:
          NODESTRO_READ: ${{ secrets.NODESTRO_READ }}
        run: |
          if [ -z "$NODESTRO_READ" ]; then
            echo "::error::The secret NODESTRO_READ is missing: a token that can read orkexa and the nodestro repositories."
            exit 1
          fi
          git config --global url."https://x-access-token:${NODESTRO_READ}@github.com/peterkarlhuber/".insteadOf "https://github.com/peterkarlhuber/"
      - run: pip install build
      - run: python -m build
      - name: Install the wheel into a fresh environment
        run: |
          python -m venv "$RUNNER_TEMP/wheel"
          "$RUNNER_TEMP/wheel/bin/pip" install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel/bin/python" -c "import nodestro_api as p; print(p.__name__, p.__version__)"
      - name: Start the installed API and call it over HTTP
        run: |
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel/bin/nodestro-api" --data-dir "$RUNNER_TEMP/data" --port 8765 > "$RUNNER_TEMP/server.log" 2>&1 &
          server=$!
          for _ in $(seq 60); do curl -fsS http://127.0.0.1:8765/api/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:8765/api/health
          curl -fsS http://127.0.0.1:8765/api/openapi.json > /dev/null
          curl -fsS http://127.0.0.1:8765/api/meta > /dev/null
          # A foreign host name is refused (DNS rebinding protection).
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: attacker.example' http://127.0.0.1:8765/api/health)" = 403
          kill "$server"
          wait "$server" || true
          cat "$RUNNER_TEMP/server.log"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
