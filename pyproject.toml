[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "nodestro-api"
version = "0.2.0"
description = "Nodestro API – the HTTP backend of Nodestro: studio REST API, run events, published workflow APIs and the standalone export."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Peter Karlhuber" }]
dependencies = [
    "nodestro-runtime @ git+https://github.com/peterkarlhuber/nodestro-runtime.git@40c8c06cc088ba98defe532287ff24f23c5bf812",
    "nodestro-examples @ git+https://github.com/peterkarlhuber/nodestro-examples.git@ed350b253053af1aa6c1f995167f6129aaf71615",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "packaging>=23",
]

[project.optional-dependencies]
# The multi-tenant studio API with logins (nodestro_api.server_app): PostgreSQL and OpenID Connect.
server = [
    # The runtime's PostgreSQL store and Axentra (off unless NODESTRO_AXENTRA=on).
    "nodestro-runtime[postgres] @ git+https://github.com/peterkarlhuber/nodestro-runtime.git@40c8c06cc088ba98defe532287ff24f23c5bf812",
    "psycopg[binary,pool]>=3.2",
    "PyJWT[crypto]>=2.9",
    "httpx>=0.27",
]
dev = [
    "nodestro-runtime[postgres] @ git+https://github.com/peterkarlhuber/nodestro-runtime.git@40c8c06cc088ba98defe532287ff24f23c5bf812",
    "httpx>=0.27",
    "psycopg[binary,pool]>=3.2",
    "PyJWT[crypto]>=2.9",
    "mypy>=1.13",
    # PostgreSQL's own parser, for the static tenant-isolation check (tests/test_tenant_filters.py).
    "pglast>=7,<9",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.8",
]

[project.scripts]
nodestro-api = "nodestro_api.cli:main"
nodestro-server = "nodestro_api.server:main"
nodestro-local = "nodestro_api.local_container:main"

[project.urls]
Repository = "https://github.com/peterkarlhuber/nodestro-api"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/nodestro_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["nodestro_api"]
known-third-party = ["nodestro_runtime", "nodestro_examples"]
known-local-folder = ["architect_script", "conftest", "test_runs", "test_flow", "test_files", "test_automation"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["nodestro_api"]
mypy_path = "src"

[[tool.mypy.overrides]]
# Axentra is optional (nodestro-runtime[postgres] installs it): mypy also runs where it is not installed, and without
# it the Axentra switches stay off and these imports are never reached.
module = ["axentra", "axentra.*"]
ignore_missing_imports = true
