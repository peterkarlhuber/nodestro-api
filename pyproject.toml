[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "nodestro-api"
version = "0.2.0"
description = "Nodestro API – the HTTP backend of Nodestro: studio REST API, run events, published workflow APIs and the standalone export."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Peter Karlhuber" }]
dependencies = [
    "nodestro-runtime>=0.2.0,<0.3",
    # The API imports orkexa itself (providers, pricing, usage, errors), so it declares it: always the version range
    # the runtime declares (MUP-ONA B0). The exact commits of every internal package live in the studio lock
    # (nodestro-studio platform/internal-server.txt).
    "orkexa>=0.2.0.dev0,<0.3",
    "nodestro-examples>=0.3.0,<0.4",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "packaging>=23",
]

[project.optional-dependencies]
# The multi-tenant studio API with logins (nodestro_api.server_app): PostgreSQL and OpenID Connect.
server = [
    # The runtime's PostgreSQL store and Axentra (off unless NODESTRO_AXENTRA=on).
    "nodestro-runtime[postgres]>=0.2.0,<0.3",
    "psycopg[binary,pool]>=3.2",
    "PyJWT[crypto]>=2.9",
    "httpx>=0.27",
]
dev = [
    "nodestro-runtime[postgres]>=0.2.0,<0.3",
    "httpx>=0.27",
    "psycopg[binary,pool]>=3.2",
    "PyJWT[crypto]>=2.9",
    "mypy>=1.13",
    # The PostgreSQL skip/require rule of the tests (tests/postgres_support.py, TABRION MIG-NOD-1): the same minor range
    # as nodestro-runtime's dev extra (VER-1, RC-8); the exact commit, a final release, lives in the studio lock.
    "tabrion[testing,postgres]>=0.1,<0.2",
    # PostgreSQL's own parser, for the static tenant-isolation check (tests/test_tenant_filters.py).
    "pglast>=7,<9",
    "pytest>=8",
    "pytest-cov>=5",
    # The app contract's JSON Schemas (tests/contract).
    "jsonschema>=4.18",
    # Open the generated Word and Excel result files like an office program would (tests/test_result_formats.py).
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "ruff>=0.8",
]

[project.scripts]
nodestro-api = "nodestro_api.cli:main"
nodestro-server = "nodestro_api.server:main"
nodestro-local = "nodestro_api.local_container:main"

[project.urls]
Repository = "https://github.com/peterkarlhuber/nodestro-api"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/nodestro_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["nodestro_api"]
known-third-party = ["nodestro_runtime", "nodestro_examples"]
known-local-folder = ["architect_script", "conftest", "test_runs", "test_flow", "test_files", "test_automation"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["nodestro_api"]
mypy_path = "src"

[[tool.mypy.overrides]]
# Axentra is optional (nodestro-runtime[postgres] installs it): mypy also runs where it is not installed, and without
# it the Axentra switches stay off and these imports are never reached.
module = ["axentra", "axentra.*"]
ignore_missing_imports = true
