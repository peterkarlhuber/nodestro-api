[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "nodestro-api"
version = "0.2.0"
description = "Nodestro API – the HTTP backend of Nodestro: studio REST API, run events, published workflow APIs and the standalone export."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Peter Karlhuber" }]
dependencies = [
    "nodestro-runtime @ git+https://github.com/peterkarlhuber/nodestro-runtime.git@7fd8761e5d91256af9ca3b35b78861f70e880038",
    "nodestro-examples @ git+https://github.com/peterkarlhuber/nodestro-examples.git@f1c64037f5f719e8e613b23646f72ac355e1d1ba",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "packaging>=23",
]

[project.optional-dependencies]
# The multi-tenant studio API with logins (nodestro_api.server_app): PostgreSQL and OpenID Connect.
server = [
    "psycopg[binary,pool]>=3.2",
    "PyJWT[crypto]>=2.9",
    "httpx>=0.27",
]
dev = [
    "httpx>=0.27",
    "psycopg[binary,pool]>=3.2",
    "PyJWT[crypto]>=2.9",
    "mypy>=1.13",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.8",
]

[project.scripts]
nodestro-api = "nodestro_api.cli:main"
nodestro-server = "nodestro_api.server:main"
nodestro-local = "nodestro_api.local_container:main"

[project.urls]
Repository = "https://github.com/peterkarlhuber/nodestro-api"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/nodestro_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["nodestro_api"]
known-third-party = ["nodestro_runtime", "nodestro_examples"]
known-local-folder = ["architect_script", "conftest", "test_runs", "test_flow", "test_files", "test_automation"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["nodestro_api"]
mypy_path = "src"

[[tool.mypy.overrides]]
# The MCP SDK needs Python 3.11+ (a runtime dependency with an environment marker); on 3.10 it is not installed and
# the MCP server endpoint answers mcp.unavailable.
module = ["mcp", "mcp.*", "mcp_types", "mcp_types.*"]
ignore_missing_imports = true
